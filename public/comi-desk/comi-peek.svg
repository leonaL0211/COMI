<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">COMI — Peek / Look Around</title>
  <desc id="desc">COMI leans left and looks curiously around, swaying gently.</desc>
  <defs>
    <path id="comi-body-shape" d="M190 40C92 40 20 111 20 207C20 306 98 360 205 360C283 360 343 326 378 277C389 262 384 250 368 249C349 248 342 239 340 218C331 119 280 40 190 40Z"/>
    <style>
      .comi-sway {
        transform-origin: 200px 330px;
        animation: comi-sway 4.8s ease-in-out infinite;
      }
      @keyframes comi-sway {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-3deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .comi-sway { animation: none; }
      }
    </style>
  </defs>
  <g id="comi-pose" transform="translate(-8 4) rotate(-5 200 330)">
    <g class="comi-sway">
      <use id="comi-body" href="#comi-body-shape" fill="#FDDB88"/>
      <g id="comi-eyes" fill="#FFFDF8" transform="translate(-14 -2)">
        <rect id="eye-left" x="114" y="142" width="28" height="68" rx="14" transform="rotate(-2 128 176)"/>
        <rect id="eye-right" x="182" y="142" width="28" height="68" rx="14" transform="rotate(-2 196 176)"/>
      </g>
    </g>
  </g>
</svg>
